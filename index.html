<style>

<canvas id="stars" aria-hidden="true"></canvas><section class="hero" id="home"><nav class="topbar" aria-label="Language"><button type="button" class="lang" data-lang="ru">RU</button><button type="button" class="lang" data-lang="en">EN</button></nav><div class="planet-wrap" aria-hidden="true"><div class="planet"><div class="storm"></div></div></div><main class="hero-content"><h1 class="brand">ZHUK WORKSPACE</h1><p class="subtitle" data-i18n="services">САЙТЫ · БОТЫ · АВТОМАТИЗАЦИЯ · AI</p><a href="#about" class="explore"><span data-i18n="explore">ИССЛЕДОВАТЬ</span><span aria-hidden="true">↓</span></a></main><span class="scroll-note" data-i18n="scroll">ЛИСТАЙ ВНИЗ</span></section>
<section class="about" id="about"><span class="eyebrow" data-i18n="about_label">01 / ОБО МНЕ</span><h2 data-i18n="about_title">Создаю цифровые решения, которые работают.</h2><p data-i18n="about_text">Разработка сайтов, Telegram-ботов и AI-автоматизаций. Этот раздел скоро дополнится оригинальной фотографией с ноутбуком, проектами и историей Zhuk Workspace.</p></section>
<script>
const tr={ru:{services:"САЙТЫ · БОТЫ · АВТОМАТИЗАЦИЯ · AI",explore:"ИССЛЕДОВАТЬ",scroll:"ЛИСТАЙ ВНИЗ",about_label:"01 / ОБО МНЕ",about_title:"Создаю цифровые решения, которые работают.",about_text:"Разработка сайтов, Telegram-ботов и AI-автоматизаций. Этот раздел скоро дополнится оригинальной фотографией с ноутбуком, проектами и историей Zhuk Workspace."},en:{services:"WEBSITES · BOTS · AUTOMATION · AI",explore:"EXPLORE",scroll:"SCROLL DOWN",about_label:"01 / ABOUT ME",about_title:"Building digital solutions that work.",about_text:"Websites, Telegram bots and AI automation. This section will feature my original laptop portrait, projects and the Zhuk Workspace story."}};
function setLang(lang){if(!tr[lang])lang="ru";document.documentElement.lang=lang;document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=tr[lang][el.dataset.i18n]);document.querySelectorAll(".lang").forEach(el=>{el.classList.toggle("active",el.dataset.lang===lang);el.setAttribute("aria-pressed",String(el.dataset.lang===lang))});try{localStorage.setItem("zhuk-language",lang)}catch(e){}}
document.querySelectorAll(".lang").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));let saved;try{saved=localStorage.getItem("zhuk-language")}catch(e){}setLang(saved||((navigator.language||"ru").startsWith("ru")?"ru":"en"));
const canvas=document.getElementById("stars"),ctx=canvas.getContext("2d"),reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;let stars=[],w=0,h=0,dpr=1,mouse={x:0,y:0};function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+"px";canvas.style.height=h+"px";ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.min(260,Math.max(95,Math.floor(w*h/5000)));stars=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,r:.25+Math.random()*1.35,s:.04+Math.random()*.19,a:.18+Math.random()*.65,phase:Math.random()*7}));}addEventListener("resize",resize,{passive:true});addEventListener("pointermove",e=>{mouse.x=(e.clientX/w-.5)*9;mouse.y=(e.clientY/h-.5)*9},{passive:true});resize();let start=performance.now(),last=start;function draw(now){let dt=Math.min(40,now-last);last=now;ctx.clearRect(0,0,w,h);let t=(now-start)*.001;for(const s of stars){if(!reduced){s.y+=s.s*dt*.06;if(s.y>h+2)s.y=-2}const alpha=s.a*(.85+.15*Math.sin(t*1.3+s.phase));ctx.fillStyle="rgba(236,240,255,"+alpha+")";ctx.beginPath();ctx.arc(s.x+mouse.x*s.r,s.y+mouse.y*s.r,s.r,0,Math.PI*2);ctx.fill()}if(!reduced&&document.visibilityState==="visible")requestAnimationFrame(draw)}requestAnimationFrame(draw);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!reduced){last=performance.now();requestAnimationFrame(draw)}})
</script></body></html>
